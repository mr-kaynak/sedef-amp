name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  CLANG_FORMAT_VERSION: "23.1.3"
  # Validators and smoke tests open the editor: no update checks from CI (docs/updates.md).
  SEDEF_DISABLE_UPDATE_CHECK: "1"

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: clang-format
        run: |
          git ls-files 'engine/*.h' 'engine/*.cpp' 'plugin/*.h' 'plugin/*.cpp' 'tools/*.h' 'tools/*.cpp' \
            | xargs clang-format --dry-run --Werror

  engine:
    name: engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-engine-${{ matrix.os }}-${{ hashFiles('**/CMakeLists.txt') }}
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake --preset engine -DSEDEF_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset engine
      - name: Test
        run: ctest --preset engine --output-on-failure

  sanitizers:
    name: engine tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-asan-${{ hashFiles('**/CMakeLists.txt') }}
      - uses: lukka/get-cmake@latest
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan --output-on-failure

  tsan:
    name: engine tests (TSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-tsan-${{ hashFiles('**/CMakeLists.txt') }}
      - uses: lukka/get-cmake@latest
      - run: cmake --preset tsan
      - run: cmake --build --preset tsan
      - name: Concurrency tests, repeated
        run: |
          for i in $(seq 1 20); do
            ./build/tsan/engine/sedef_engine_tests "[concurrency]" --rng-seed "$i"
          done
      - run: ctest --preset tsan --output-on-failure

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:midi
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist-midi
          path: ui/dist-midi

  plugin:
    name: plugin (${{ matrix.os }})
    needs: [ui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist-midi
          path: ui/dist-midi
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-plugin-${{ matrix.os }}-${{ hashFiles('**/CMakeLists.txt') }}
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev \
            xvfb ladspa-sdk
      - name: Configure
        shell: bash
        run: >
          cmake --preset release -DSEDEF_BUILD_UI=OFF -DSEDEF_BUILD_TESTS=OFF -DSEDEF_BUILD_HOST_SMOKE=ON
          -DSEDEF_BUILD_PLUGIN_TESTS=ON
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}
      - name: Build
        shell: bash
        run: |
          targets=(SedefAmp_All SedefAmp_CLAP sedef-host-smoke sedef_update_tests sedef_capture_tests
                   SedefMidi_All SedefMidi_CLAP sedef_midi_tests)
          # The instrument AU (Logic's side-chain route) exists on macOS only.
          if [ "$RUNNER_OS" = "macOS" ]; then targets+=(SedefMidiInstrument_All); fi
          cmake --build --preset release --target "${targets[@]}"
      - name: Update checker tests
        shell: bash
        run: build/release/plugin/sedef_update_tests_artefacts/Release/sedef_update_tests
      - name: Capture library tests
        shell: bash
        run: build/release/plugin/sedef_capture_tests_artefacts/Release/sedef_capture_tests
      - name: Sedef MIDI tests (hosted VST3, MIDI ports)
        shell: bash
        run: |
          tests=build/release/plugin/sedef_midi_tests_artefacts/Release/sedef_midi_tests
          # Durations name each test as it finishes, so a crash shows where it happened.
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$tests" --durations yes; else "$tests" --durations yes; fi
      - name: UI smoke test (editor in a real WebView)
        shell: bash
        env:
          # WebKitGTK's DMA-BUF renderer often fails to start under Xvfb on CI runners.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a tools/ci/ui-smoke.sh build/release/plugin
            xvfb-run -a tools/ci/ui-smoke.sh build/release/plugin SedefMidi "Sedef MIDI"
          else
            tools/ci/ui-smoke.sh build/release/plugin
            tools/ci/ui-smoke.sh build/release/plugin SedefMidi "Sedef MIDI"
          fi
      # On Linux, fetch-validators.sh builds pluginval with a JUCE fix (the script explains why).
      - name: Cache pluginval build (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/validators/pluginval-linux
          key: pluginval-${{ matrix.os }}-${{ hashFiles('tools/ci/fetch-validators.sh', 'tools/ci/patches/**') }}
      - name: Fetch validators
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/fetch-validators.sh "$RUNNER_TEMP/validators"
      - name: Validate
        shell: bash
        env:
          VALIDATOR_OUTPUT: ${{ runner.temp }}/clap-validator-output
        run: |
          artefacts=build/release/plugin/SedefAmp_artefacts/Release
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a tools/ci/validate-plugins.sh "$artefacts"
          else
            tools/ci/validate-plugins.sh "$artefacts"
          fi
      - name: Validate Sedef MIDI
        shell: bash
        env:
          VALIDATOR_OUTPUT: ${{ runner.temp }}/clap-validator-output-midi
        run: |
          plugin=build/release/plugin
          validate() {
            if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a tools/ci/validate-plugins.sh "$@"
            else tools/ci/validate-plugins.sh "$@"; fi
          }
          validate "$plugin/SedefMidi_artefacts/Release" "Sedef MIDI" aufx Sdm1
          if [ "$RUNNER_OS" = "macOS" ]; then
            validate "$plugin/SedefMidiInstrument_artefacts/Release" "Sedef MIDI Instrument" aumu Sdm2
          fi
      - name: Keep validator output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validator-output-${{ runner.os }}
          path: |
            ${{ runner.temp }}/clap-validator-output
            ${{ runner.temp }}/clap-validator-output-midi
          if-no-files-found: ignore
      # upload-artifact drops executable bits, so ship a zip that keeps the bundles runnable.
      - name: Pack build
        shell: bash
        run: |
          cd build/release/plugin/SedefAmp_artefacts/Release
          if [ "$RUNNER_OS" = "macOS" ]; then
            mkdir -p "$RUNNER_TEMP/pack" && cp -R VST3 CLAP Standalone AU "$RUNNER_TEMP/pack/"
            ditto -c -k --sequesterRsrc "$RUNNER_TEMP/pack" "$GITHUB_WORKSPACE/sedef-amp-${RUNNER_OS}.zip"
          else
            7z a "$GITHUB_WORKSPACE/sedef-amp-${RUNNER_OS}.zip" VST3 CLAP Standalone
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sedef-amp-${{ runner.os }}
          path: sedef-amp-${{ runner.os }}.zip
      - name: Pack Sedef MIDI
        shell: bash
        run: |
          cd build/release/plugin/SedefMidi_artefacts/Release
          if [ "$RUNNER_OS" = "macOS" ]; then
            # The musician's test build: everything flat in one folder, with TESTING.md.
            pack="$RUNNER_TEMP/sedef-midi-test-build"
            mkdir -p "$pack"
            cp -R "Standalone/Sedef MIDI.app" "AU/Sedef MIDI.component" "VST3/Sedef MIDI.vst3" \
              "CLAP/Sedef MIDI.clap" "$pack/"
            cp -R "../../SedefMidiInstrument_artefacts/Release/AU/Sedef MIDI Instrument.component" "$pack/"
            cp "$GITHUB_WORKSPACE/tools/packaging/midi/TESTING.md" "$pack/"
            ditto -c -k --sequesterRsrc --keepParent "$pack" "$GITHUB_WORKSPACE/sedef-midi-test-build-macOS.zip"
          else
            7z a "$GITHUB_WORKSPACE/sedef-midi-${RUNNER_OS}.zip" VST3 CLAP Standalone
          fi
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: sedef-midi-test-build-macOS
          path: sedef-midi-test-build-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: sedef-midi-${{ runner.os }}
          path: sedef-midi-${{ runner.os }}.zip
