name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  CLANG_FORMAT_VERSION: "23.1.3"

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: clang-format
        run: |
          git ls-files 'engine/*.h' 'engine/*.cpp' 'plugin/*.h' 'plugin/*.cpp' 'tools/*.h' 'tools/*.cpp' \
            | xargs clang-format --dry-run --Werror

  engine:
    name: engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-engine-${{ matrix.os }}-${{ hashFiles('**/CMakeLists.txt') }}
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake --preset engine -DSEDEF_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset engine
      - name: Test
        run: ctest --preset engine --output-on-failure

  sanitizers:
    name: engine tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-asan-${{ hashFiles('**/CMakeLists.txt') }}
      - uses: lukka/get-cmake@latest
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan --output-on-failure

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  plugin:
    name: plugin (${{ matrix.os }})
    needs: [ui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-plugin-${{ matrix.os }}-${{ hashFiles('**/CMakeLists.txt') }}
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev \
            xvfb
      - name: Configure
        shell: bash
        run: >
          cmake --preset release -DSEDEF_BUILD_UI=OFF -DSEDEF_BUILD_TESTS=OFF
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}
      - name: Build
        run: cmake --build --preset release --target SedefAmp_All
      - name: Fetch validators
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/fetch-validators.sh "$RUNNER_TEMP/validators"
      - name: Validate
        shell: bash
        run: |
          artefacts=build/release/plugin/SedefAmp_artefacts/Release
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a tools/ci/validate-plugins.sh "$artefacts"
          else
            tools/ci/validate-plugins.sh "$artefacts"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sedef-amp-${{ runner.os }}
          path: |
            build/release/plugin/SedefAmp_artefacts/Release/VST3
            build/release/plugin/SedefAmp_artefacts/Release/AU
            build/release/plugin/SedefAmp_artefacts/Release/CLAP
            build/release/plugin/SedefAmp_artefacts/Release/Standalone
