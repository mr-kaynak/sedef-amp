name: Release

on:
  push:
    tags: ["v*"]
  # A dry run: builds every package and uploads them as workflow artifacts, without a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  build:
    needs: [ui]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15
            name: macOS
          - os: windows-2025
            name: Windows
          - os: ubuntu-24.04
            name: Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-plugin-${{ matrix.os }}-${{ hashFiles('**/CMakeLists.txt') }}
      - name: Check the tag matches the project version
        if: github.ref_type == 'tag'
        shell: bash
        run: tools/packaging/version.sh --check-tag "$GITHUB_REF_NAME"
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev
      - name: Configure
        shell: bash
        run: >
          cmake --preset release -DSEDEF_BUILD_UI=OFF -DSEDEF_BUILD_TESTS=OFF
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}
      - name: Build
        run: cmake --build --preset release --target SedefAmp_All SedefAmp_CLAP
      # Packaging lives in tools/packaging so the same scripts run locally (docs/releasing.md).
      - name: Signing keychain (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_DEVELOPER_ID_APP_P12: ${{ secrets.MACOS_DEVELOPER_ID_APP_P12 }}
          MACOS_DEVELOPER_ID_INSTALLER_P12: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: tools/packaging/macos/signing-keychain.sh create
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SEDEF_REQUIRE_UNIVERSAL: "1"
        run: tools/packaging/macos/package.sh build/release/plugin/SedefAmp_artefacts/Release dist
      - name: Remove signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: tools/packaging/macos/signing-keychain.sh delete
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          SEDEF_INSTALL_INNO: "1"
        run: tools/packaging/windows/build-installer.sh build/release/plugin/SedefAmp_artefacts/Release dist
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tools/packaging/linux/package.sh build/release/plugin/SedefAmp_artefacts/Release dist
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum Sedef-Amp-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        env:
          # Matches the macOS build: with the signing secrets it notarizes or fails.
          MACOS_NOTARIZED: ${{ secrets.MACOS_DEVELOPER_ID_APP_P12 != '' }}
          # Empty for a dry run: the notes then use the version from CMakeLists.txt.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: tools/packaging/release-notes.sh "$TAG" > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: |
            notes.md
            dist/SHA256SUMS.txt
      - name: Create release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/Sedef-Amp-* dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Sedef Amp ${GITHUB_REF_NAME}" \
            --notes-file notes.md --verify-tag $prerelease
