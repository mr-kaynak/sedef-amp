name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  build:
    needs: [ui]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15
            name: macOS
          - os: windows-2025
            name: Windows
          - os: ubuntu-24.04
            name: Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-plugin-${{ matrix.os }}-${{ hashFiles('**/CMakeLists.txt') }}
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev
      - name: Configure
        shell: bash
        run: >
          cmake --preset release -DSEDEF_BUILD_UI=OFF -DSEDEF_BUILD_TESTS=OFF
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}
      - name: Build
        run: cmake --build --preset release --target SedefAmp_All SedefAmp_CLAP
      - name: Sign (ad hoc, macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd build/release/plugin/SedefAmp_artefacts/Release
          for bundle in "VST3/Sedef Amp.vst3" "AU/Sedef Amp.component" "CLAP/Sedef Amp.clap" "Standalone/Sedef Amp.app"; do
            codesign --force --deep --sign - "$bundle"
          done
      - name: Package
        shell: bash
        run: |
          stage="$RUNNER_TEMP/Sedef Amp ${GITHUB_REF_NAME}"
          mkdir -p "$stage"
          cp -R build/release/plugin/SedefAmp_artefacts/Release/{VST3,CLAP,Standalone} "$stage/"
          if [ "$RUNNER_OS" = "macOS" ]; then cp -R build/release/plugin/SedefAmp_artefacts/Release/AU "$stage/"; fi
          cp LICENSE README.md THIRD_PARTY_NOTICES.md docs/install.md "$stage/"
          cd "$RUNNER_TEMP"
          7z a "$GITHUB_WORKSPACE/SedefAmp-${GITHUB_REF_NAME}-${{ matrix.name }}.zip" "Sedef Amp ${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: SedefAmp-*.zip

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum SedefAmp-*.zip > SHA256SUMS.txt
      - name: Release notes
        run: |
          # The CHANGELOG section for this version, then install notes.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat .github/release-notes.md >> notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" SedefAmp-*.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Sedef Amp ${GITHUB_REF_NAME}" \
            --notes-file notes.md --verify-tag $prerelease
