      <div data-hf-id="hf-hqu0" id="fx-cam" data-layout-allow-overflow><img data-hf-id="hf-48vb" src="assets/shots/fx.png" alt="Sedef FX page: Drift tape echo and Fathom reverb" /></div>

  <script>
    const B = 1.6;
    const F = (p) => ({ x: 960 - p.x * B * p.z, y: 540 - p.y * B * p.z, scale: B * p.z });
    const D1 = { x: 340, y: 250, z: 1.8 }; // Drift: reels, heads, sync
    const D2 = { x: 866.03, y: 278.7, z: 2.02 }; // Drift: "Repeats every 500 ms" and the right-hand knobs
    const FA = { x: 402, y: 541.8, z: 1.55 }; // Fathom whole, under Drift's knob row, clear of Doubler
    const PL = { x: 254.1, y: 577.8, z: 2.63 }; // Fathom: the plate's decay curve, Mix and Decay
    const DK = { x: 476, y: 597.2, z: 3.75 }; // Mix to Low cut, the Decay cap (443, 597.2) 156 px across
    const tl = gsap.timeline({ paused: true });
    const move = (p, t, d = 0.6) => {
      tl.to("#fx-cam", { ...F(p), duration: d, ease: "power2.inOut" }, t);
      tl.to("#fx-lens", { filter: "blur(4px)", duration: d / 2, ease: "power2.in" }, t);
      tl.to("#fx-lens", { filter: "blur(0px)", duration: d / 2, ease: "power2.out" }, t + d / 2);
    };

    // The second half of the whip from the cab (cab.html plays the first) lands on Drift for
    // "Tape echo" (20.05 s); the cab page leaves 2000 px ahead of it.
    const S = { x: 732.5, y: 422, z: 1.32 }; // cab.html's last framing
    tl.fromTo("#fx-cam", { ...F(D1), x: F(D1).x + 1000 }, { ...F(D1), duration: 0.2, ease: "power3.out" }, 0);
    tl.fromTo("#fx-prev", { ...F(S), x: F(S).x - 1000 }, { ...F(S), x: F(S).x - 2000, duration: 0.2, ease: "power3.out" }, 0);
    tl.fromTo("#fx-lens", { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0);
    tl.set("#fx-prev", { opacity: 0 }, 0.22);
    // "that drifts and breathes"
    move(D2, 1.2);
    // "Reverb" (22.77 s)
    move(FA, 2.85);
    // "as deep as you like"
    move(PL, 3.6);
    // Onto the Decay knob; its cap opens into the next world.
    tl.to("#fx-cam", { ...F(DK), duration: 0.3, ease: "power2.inOut" }, 4.2);
    tl.to("#fx-disc", { opacity: 1, duration: 0.08, ease: "none" }, 4.46);
    tl.fromTo("#fx-disc", { scale: 1 }, { scale: 20, duration: 0.5, ease: "power3.in" }, 4.5);
    tl.fromTo("#fx-disc", { "--sheen": "40deg" }, { "--sheen": "120deg", duration: 0.6, ease: "none" }, 4.4);
    tl.to("#fx-pale", { opacity: 0.96, duration: 0.4, ease: "power2.in" }, 4.6);
    window.__timelines["fx"] = tl;
  </script>
