    // Camera on the board: frame board point p at zoom z (1 = 1 board px per screen px).
    const Fw = (p) => ({ x: 960 - p.x * p.z, y: 540 - p.y * p.z, scale: p.z });
    const C0 = { x: 1200, y: 650, z: 0.889 }; // frets 9-12, the name's fret centred
    const C1 = { x: 1395, y: 650, z: 1.8 }; // the name and the 12th-fret double dot, both whole
    const C2 = { x: 1777, y: 470, z: 30 }; // through the upper dot
    const tl = gsap.timeline({ paused: true });
    tl.set("#in-world", Fw(C0), 0);

    // The raking light crosses the whole scene; the nacre turns with it.
    tl.fromTo("#in-rake", { x: -700 }, { x: 1400, duration: 7, ease: "none" }, 0);
    tl.fromTo("#in-world", { "--sheen": "0deg" }, { "--sheen": "160deg", duration: 7, ease: "none" }, 0);

    // "This is Sedef." (0.98 s): each letter is routed into the wood, then the shell is pressed in.
    tl.fromTo(".in-cav span", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out", stagger: 0.1 }, 0.68);
    tl.fromTo(
      ".in-nac span",
      { opacity: 0, scale: 1.12, y: -8, filter: "blur(4px)" },
      { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.1 },
      0.74,
    );

    // "mother-of-pearl" (2.58 s): a shimmer runs through the letters, then the dots.
    tl.fromTo(".in-nac span", { "--shim": "-40%" }, { "--shim": "140%", duration: 0.7, ease: "power2.inOut", stagger: 0.07 }, 2.55);
    tl.fromTo(".in-dot", { "--shim": "-40%" }, { "--shim": "140%", duration: 0.7, ease: "power2.inOut", stagger: 0.1 }, 2.95);

    // "inlaid" (4.5 s): the camera moves in on the name and the 12th fret.
    tl.to("#in-world", { ...Fw(C1), duration: 0.6, ease: "power2.inOut" }, 4.5);
    tl.fromTo("#in-lens", { filter: "blur(0px)" }, { filter: "blur(4px)", duration: 0.3, ease: "power2.in" }, 4.5);
    tl.to("#in-lens", { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 4.8);
    tl.fromTo("#in-dot-a", { "--shim": "-40%" }, { "--shim": "140%", duration: 0.8, ease: "power2.inOut", immediateRender: false }, 5.35);

    // Into the upper dot until its nacre fills the frame (the next scene starts inside it).
    tl.to("#in-world", { ...Fw(C2), duration: 0.85, ease: "power3.in" }, 6.15);
    tl.to("#in-lens", { filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, 6.75);
    window.__timelines["inlay"] = tl;
