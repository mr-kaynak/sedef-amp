  <script>
    // Camera on a 1200x760 capture: frame design point p at zoom z (1 = 1.6x, the window 1920 wide).
    const B = 1.6;
    const F = (p) => ({ x: 960 - p.x * B * p.z, y: 540 - p.y * B * p.z, scale: B * p.z });
    const K = { x: 417, y: 310, z: 4 }; // Pearl's gain knob cap, 170 px across
    const P = { x: 467, y: 486, z: 1.35 }; // Pearl between Tide and Coral, below Gate/Transpose
    const W = { x: 600, y: 380, z: 0.86 }; // the whole window
    const move = (p, t, d = 0.6) => {
      tl.to("#rg-cam", { ...F(p), duration: d, ease: "power2.inOut" }, t);
      tl.to("#rg-lens", { filter: "blur(4px)", duration: d / 2, ease: "power2.in" }, t);
      tl.to("#rg-lens", { filter: "blur(0px)", duration: d / 2, ease: "power2.out" }, t + d / 2);
    };
    const tl = gsap.timeline({ paused: true });

    // Out of the inlay: the nacre shrinks onto the knob cap as the camera comes out of it.
    tl.fromTo("#rg-cam", F({ ...K, z: 6.5 }), { ...F(K), duration: 0.6, ease: "power3.out" }, 0);
    tl.fromTo("#rg-disc", { scale: 15.3 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 0);
    tl.fromTo("#rg-disc", { "--sheen": "160deg" }, { "--sheen": "200deg", duration: 0.7, ease: "none" }, 0);
    tl.fromTo("#rg-lens", { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 0);
    tl.to("#rg-disc", { opacity: 0, duration: 0.2, ease: "power1.inOut" }, 0.52);

    // "a complete guitar rig": back through the pedals...
    move(P, 0.85);
    // ...and the whole window lands on the drum entry (10.7 s).
    move(W, 3.0, 0.7);
    window.__timelines["rig"] = tl;
  </script>
