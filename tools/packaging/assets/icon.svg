<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <!-- Sedef Amp app icon: the nacre star on a deep-water tile (macOS icon grid, 824 px body). -->
  <title>Sedef Amp</title>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4258"/>
      <stop offset="0.55" stop-color="#0b1c27"/>
      <stop offset="1" stop-color="#061119"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8f1ea" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c8f1ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="nacre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cdeeee"/>
      <stop offset="0.35" stop-color="#ddd6f6"/>
      <stop offset="0.65" stop-color="#f6dbe2"/>
      <stop offset="1" stop-color="#f2e8cb"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.34" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#water)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>
  <circle cx="512" cy="512" r="330" fill="url(#glow)"/>
  <g transform="translate(512 512) scale(14.5) translate(-20 -20)">
    <polygon points="20.00,1.50 23.83,10.75 33.08,6.92 29.25,16.17 38.50,20.00 29.25,23.83 33.08,33.08 23.83,29.25 20.00,38.50 16.17,29.25 6.92,33.08 10.75,23.83 1.50,20.00 10.75,16.17 6.92,6.92 16.17,10.75" fill="url(#nacre)"/>
    <polygon points="20.00,1.50 23.83,10.75 33.08,6.92 29.25,16.17 38.50,20.00 29.25,23.83 33.08,33.08 23.83,29.25 20.00,38.50 16.17,29.25 6.92,33.08 10.75,23.83 1.50,20.00 10.75,16.17 6.92,6.92 16.17,10.75" fill="url(#sheen)"/>
    <circle cx="20" cy="20" r="2.4" fill="#0b1c27" fill-opacity="0.8"/>
  </g>
</svg>
